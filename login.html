<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UID Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .logo {
            width: 60px;
            height: 60px;
            background: #00ff41;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 28px;
            color: #000000;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .header p {
            color: #666666;
            font-size: 14px;
        }

        .info-box {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .info-box h3 {
            color: #00ff41;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .info-box p {
            color: #888888;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #888888;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #222222;
            border-radius: 8px;
            font-size: 15px;
            background: #111111;
            color: #ffffff;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff41;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #00ff41;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #000000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .result.error {
            display: block;
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.2);
        }

        .result.success {
            display: block;
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #444444;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚡</div>
            <h1>UID Manager</h1>
            <p>Access the system</p>
        </div>

        <div class="info-box">
            <h3>Welcome</h3>
            <p>Click the button below to access the UID management system.</p>
        </div>

        <div class="form-group" style="text-align: center; margin-bottom: 24px;">
            <p style="color: #888; font-size: 14px; margin-bottom: 20px;">Click below to access UID Manager</p>
            <button onclick="enterSystem()" class="login-btn" id="loginBtn" style="width: 200px;">
                <span class="spinner"></span>
                <span class="btn-text">Enter System</span>
            </button>
        </div>

        <div class="footer">
            UID Management System
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');

        // Auto-redirect if already entered
        if (localStorage.getItem('userSession')) {
            window.location.href = 'index.html';
        }

        async function enterSystem() {
            loginBtn.classList.add('loading');

            try {
                // Call backend (no key needed)
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                // Store session
                localStorage.setItem('userSession', 'active');
                localStorage.setItem('loginTime', new Date().toISOString());

                // Redirect
                window.location.href = 'index.html';

            } catch (error) {
                alert('Failed to connect. Please try again.');
                loginBtn.classList.remove('loading');
            }
        }
    </script>
</body>
</html>
